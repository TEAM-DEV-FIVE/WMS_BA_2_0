# PostgreSQL 16 dedicated host profile; B22 adds measured archive/backup settings.
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'
max_connections = 60
shared_buffers = '2GB'
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
# SQL ERROR text can still contain data. PG logs remain postgres/DBA-only.
