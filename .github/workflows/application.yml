name: Validate WMS application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-app-lock.txt
      - run: python scripts/ci_support.py --name dependencies -- python -m pip install -r requirements-app-lock.txt
      - run: python scripts/ci_support.py --name editable -- python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/ci_support.py --name lint -- python -m ruff check apps packages tests scripts
      - run: python scripts/ci_support.py --name contract -- python scripts/export_runtime_contract.py --check
      - run: python scripts/check_application.py --suite unit --report .reports/unit.xml
      - name: All non-DB Windows Tk tests
        if: runner.os == 'Windows'
        run: python scripts/check_application.py --suite gui --report .reports/tk.xml
      - run: python scripts/ci_support.py --name build -- python -m build --no-isolation
      - name: Install wheel and import outside source checkout
        run: python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-${{ matrix.os }}-${{ github.sha }}
          path: |
            .reports/
            dist/*
          include-hidden-files: true
          retention-days: 14

  application-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: wms_test_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms_test -d wms_test_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WMS_TEST_DATABASE_URL: postgresql+psycopg://wms_test:local-ci-only@localhost:5432/wms_test_bootstrap
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-app-lock.txt
      - name: Install Linux GUI test requirements
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth nginx
      - run: python scripts/ci_support.py --name dependencies -- python -m pip install -r requirements-app-lock.txt
      - run: python scripts/ci_support.py --name editable -- python -m pip install --no-deps --no-build-isolation -e .
      - name: Full discovered suite with real PostgreSQL and Linux GUI
        run: xvfb-run -a python scripts/check_application.py --gui --expected-pg-major ${{ matrix.version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-postgres-${{ matrix.version }}-${{ github.sha }}
          path: .reports/
          include-hidden-files: true
          retention-days: 14
