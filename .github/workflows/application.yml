name: Validate WMS application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-app-lock.txt
      - run: python -m pip install -r requirements-app-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check apps packages tests/foundation scripts/check_application.py
      - run: python -m pytest tests -q -m "not integration and not gui" --junitxml=.reports/unit.xml
      - name: Windows Tk smoke
        if: runner.os == 'Windows'
        run: python -m pytest tests/foundation/test_desktop.py -q -m gui --junitxml=.reports/tk.xml
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-${{ matrix.os }}
          path: |
            .reports/*.xml
            dist/*
          include-hidden-files: true

  application-postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: wms_test_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms_test -d wms_test_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WMS_TEST_DATABASE_URL: postgresql+psycopg://wms_test:local-ci-only@localhost:5432/wms_test_bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-app-lock.txt
      - run: python -m pip install -r requirements-app-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: xvfb-run -a python scripts/check_application.py --gui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-postgres-${{ matrix.version }}
          path: .reports/*.xml
          include-hidden-files: true
