name: Native Windows standalone MySQL server
on:
  push:
    branches: ['feat/windows-standalone-20261018']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-server:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install isolated MySQL 8.4 LTS binaries
        if: matrix.mysql == '8.4'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-8.4.11-winx64.zip'
          Invoke-WebRequest 'https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-8.4.11-winx64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm MD5).Hash -ne '2e833921898a9a030ea6bfe81bd811bc') { throw 'MySQL archive checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'wms-mysql84'
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          $binary = Join-Path $destination 'mysql-8.4.11-winx64\bin\mysqld.exe'
          if (!(Test-Path $binary)) { throw 'MySQL 8.4 binary missing' }
          "WMS_NATIVE_MYSQL_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install locked dependencies and wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --only-binary=:all: -r requirements-app-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m build --wheel --no-isolation
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          python -m pip install --no-deps (Get-ChildItem dist/*.whl)[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Wheel installation failed' }
      - name: Native PDF rendering and worker regression tests
        shell: pwsh
        run: |
          python -m pytest tests/foundation/test_print_render_scanner.py tests/foundation/test_outbox.py tests/foundation/test_windows_standalone.py -m 'not integration' -q
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Validate PowerShell examples in Windows recovery guide
        shell: pwsh
        run: |
          $guide = Get-Content -LiteralPath '01_Tai_lieu/WINDOWS_MYSQL_RECOVERY.md' -Raw -Encoding utf8
          $blocks = [regex]::Matches($guide, '(?ms)^```powershell\r?\n(.*?)^```')
          if ($blocks.Count -lt 15) { throw 'Expected the complete numbered recovery guide' }
          foreach ($block in $blocks) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($block.Groups[1].Value, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          Write-Host "PASS: $($blocks.Count) PowerShell examples parsed; examples were not executed."
      - name: Real MySQL and installed server on NTFS
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'check_windows_server.py'
          Copy-Item scripts/check_windows_server.py $script
          Push-Location $env:RUNNER_TEMP
          python -I $script
          $result = $LASTEXITCODE
          Pop-Location
          if ($result -ne 0) { throw 'Native MySQL server integration failed' }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'native-windows-server-result.json') dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Windows-Server-${{ matrix.mysql }}-${{ github.sha }}
          path: dist/
          retention-days: 14
