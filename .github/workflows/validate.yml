name: Validate WMS design

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python scripts/ci_support.py --name design-dependencies -- python -m pip install -r requirements-dev.txt
      - run: python scripts/ci_support.py --name design-tests -- python -m unittest discover -s tests -v
      - run: python scripts/ci_support.py --name artifacts -- python scripts/check_artifacts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-${{ github.sha }}
          path: .reports/
          include-hidden-files: true
          retention-days: 14

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: wms_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: wms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms_test -d wms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: wms_test
      PGPASSWORD: local-ci-only
      PGDATABASE: wms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record PostgreSQL environment
        run: python scripts/ci_support.py --name postgres-version -- psql -X -c "SELECT version()"
      - name: Create schema and seed
        run: |
          python scripts/ci_support.py --name schema -- psql -X -v ON_ERROR_STOP=1 -f 02_CSDL/001_schema.sql
          python scripts/ci_support.py --name seed -- psql -X -v ON_ERROR_STOP=1 -f 02_CSDL/002_seed_permissions.sql
      - name: Check constraints and append-only triggers
        run: python scripts/ci_support.py --name sql-smoke -- psql -X -v ON_ERROR_STOP=1 -f tests/sql/schema_smoke.sql
      - name: Reconcile empty database after fixture rollback
        run: |
          psql -X -qAt -v ON_ERROR_STOP=1 -f 02_CSDL/reconcile.sql > .reports/reconcile.txt
          test ! -s .reports/reconcile.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-postgres-${{ matrix.version }}-${{ github.sha }}
          path: .reports/
          include-hidden-files: true
          retention-days: 14
