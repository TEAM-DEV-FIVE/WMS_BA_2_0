[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wms-lan"
version = "0.1.0"
description = "WMS desktop and API foundation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.121,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23.1,<26", "cryptography>=44,<52", "pyotp>=2.9,<3", "tzdata>=2025.2", "reportlab>=5.0.1,<6"]
desktop = ["httpx>=0.27,<1", "pypdfium2>=5.14,<6", "pillow>=12.3,<13"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2", "ruff>=0.11,<1", "openapi-spec-validator==0.9.0", "zxing-cpp>=3.1,<4"]

[project.scripts]
wms-server = "apps.server.__main__:main"
wms-desktop = "apps.desktop.__main__:main"
wms-migrate = "apps.server.infrastructure.migrations:main"

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "migrations*"]

[tool.setuptools.package-data]
migrations = ["*.sql"]
"apps.server.printing_assets" = ["*.ttf", "*.txt"]
"apps.desktop.local_store" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires a disposable PostgreSQL database", "gui: needs Tk and a display (or Xvfb)"]

[tool.ruff]
target-version = "py312"
line-length = 110
include = ["apps/**/*.py", "packages/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
